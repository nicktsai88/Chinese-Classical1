        const allKeywords = {};
        contentData.segments.forEach((seg, idx) => {
            Object.entries(seg.notes).forEach(([key, note]) => {
                if (!allKeywords[key]) {
                    allKeywords[key] = { ...note, segIdx: idx };
                }
            });
        });

        // ----------------------------------------------------
        // 2. 全域狀態管理 (靜態版本)
        // ----------------------------------------------------
        let currentTab = 'overview';
        let userAnswers = {}; 

        window.onload = function() {
            document.getElementById('main-title').textContent = contentData.metadata.title;
            document.getElementById('author-name').textContent = contentData.metadata.author;
            document.getElementById('source-name').textContent = contentData.metadata.source;

            if ('speechSynthesis' in window) {
                 window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
            }

            document.addEventListener('click', (e) => {
                const popup = document.getElementById('note-template');
                if (!e.target.closest('.interactive-word') && !e.target.closest('.note-popup')) {
                    closeNote();
                }
            });
        };

        function closeNote() {
            const popup = document.getElementById('note-template');
            if(popup) { popup.classList.add('hidden'); popup.style.display = ''; }
        }

        function switchTab(tabId) {
            currentTab = tabId;
            closeNote();
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            const container = document.getElementById('content-display');
            container.style.opacity = '0';
            
            setTimeout(() => {
                switch(tabId) {
                    case 'overview': renderOverview(container); break;
                    case 'reading': renderReading(container); break;
                    case 'deep': renderDeepUnderstanding(container); break;
                    case 'vocabulary': renderVocabulary(container); break;
                    case 'analysis': renderAnalysis(container); break;
                    case 'quiz': renderQuiz(container); break;
                    case 'story': renderStory(container); break;
                }
                container.style.opacity = '1';
            }, 200);
        }

        function renderOverview(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto">

                </div>
            `;

            container.innerHTML = `<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-amber-200">${imageContent}<div class="p-8 sm:p-10"><div class="flex items-center mb-6 text-orange-600 text-sm font-bold uppercase tracking-widest border-b border-orange-100 pb-2"><i class="fas fa-compass mr-2"></i> 抉擇時刻</div><p class="text-xl sm:text-2xl leading-relaxed text-stone-800 mb-10 font-serif">${node.text}</p>${node.isEnding ? (node.win ? `<div class="text-center mb-8 text-green-700 font-bold text-2xl p-6 bg-green-50 rounded-xl border border-green-200 shadow-sm"><i class="fas fa-check-circle mr-3"></i>開明盛世</div>` : `<div class="text-center mb-8 text-amber-800 font-bold text-2xl p-6 bg-amber-50 rounded-xl border border-amber-200 shadow-sm"><i class="fas fa-redo mr-3"></i>重新體驗</div>`) : ''}<div class="grid gap-4">${node.choices.map(c => `<button onclick="nextStoryNode('${c.next}')" class="story-choice w-full py-5 px-8 bg-white hover:bg-amber-100 border-2 border-amber-200 hover:border-amber-400 rounded-xl text-amber-950 font-bold text-xl transition duration-200 flex items-center justify-between group shadow-sm hover:shadow-md text-left"><span>${c.text}</span><i class="fas fa-chevron-right text-amber-400 group-hover:text-amber-600 transition transform group-hover:translate-x-1"></i></button>`).join('')}</div></div></div>`;
            if(node.win) { try { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); } catch (e) { console.log("Confetti not loaded"); } }
        }

        function nextStoryNode(nodeId) {
            window.currentStoryNode = nodeId;
            renderStory(document.getElementById('content-display'));
        }

        function checkAnswer(idx, val, ans) {
            if (userAnswers[idx] !== undefined) return; 
            userAnswers[idx] = val; 
            const radios = document.getElementsByName(`q-${idx}`);
            for (let radio of radios) {
                radio.disabled = true;
                radio.parentElement.classList.add('disabled-label');
            }

            const feedbackEl = document.getElementById(`feedback-${idx}`);
            const card = document.getElementById(`quiz-card-${idx}`);
            const qData = contentData.quiz[idx];
            if (!feedbackEl || !card) return;
            
            feedbackEl.className = 'mt-4 p-4 rounded-lg text-base animate-fade-in border';
            card.classList.remove('bg-white');

            if (val === ans) {
                feedbackEl.innerHTML = `<strong class="block mb-1 text-lg"><i class="fas fa-check-circle mr-2"></i>答對了！</strong>${qData.exp}`;
                feedbackEl.classList.add('bg-green-50', 'border-green-200', 'text-green-900');
                card.classList.add('bg-green-50/60', 'border-green-500');
            } else {
                const correctOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === ans);
                const userOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === val);
                
                feedbackEl.innerHTML = `
                    <div class="mb-2">
                        <span class="block font-bold text-red-700 text-lg"><i class="fas fa-times-circle mr-2"></i>答錯了</span>
                        <span class="block text-amber-900 mt-1">您的答案：${userOption}</span>
                        <span class="block text-green-700 font-bold mt-1">正確答案：${correctOption}</span>
                    </div>
                    <div class="pt-2 border-t border-red-200 mt-2 text-stone-800">
                        <strong><i class="fas fa-lightbulb text-yellow-600 mr-1"></i>解析：</strong>${qData.exp}
                    </div>
                `;
                feedbackEl.classList.add('bg-red-50', 'border-red-200', 'text-stone-800');
                card.classList.add('bg-red-50/60', 'border-red-500');
            }
            feedbackEl.classList.remove('hidden');
        }

        function submitQuiz() {
            const total = contentData.quiz.length;
            const answered = Object.keys(userAnswers).length;
            
            if (answered < total) {
                showError(`您還有 ${total - answered} 題未完成，請作答完畢後再交卷！`);
                return;
            }
            
            let correctCount = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === contentData.quiz[i].ans) {
                    correctCount++;
                }
            }
            
            const score = Math.round((correctCount / total) * 100);
            const scoreText = document.getElementById('score-text');
            scoreText.innerHTML = `您的總分是 <span class="text-amber-700 font-bold text-5xl">${score}</span> 分`;
            
            const modal = document.getElementById('score-modal');
            modal.classList.remove('hidden');
            
            try {
                if(score >= 80) { confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } }); }
            } catch(e) {}
        }

        function closeScoreModal() {
            const modal = document.getElementById('score-modal');
            modal.classList.add('hidden');
        }

        function showNote(key, segIdx, el, e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const popup = document.getElementById('note-template');
            const content = document.getElementById('note-content');
            let noteData = null;
            
            if (segIdx !== undefined && contentData.segments[segIdx] && contentData.segments[segIdx].notes[key]) { 
                noteData = contentData.segments[segIdx].notes[key]; 
            } else if (allKeywords[key]) { 
                noteData = allKeywords[key]; 
            }
            
            if(!noteData) return;
            
            content.innerHTML = `
                <div class="flex items-baseline justify-between border-b border-amber-100 pb-2 mb-2">
                    <h4 class="text-xl font-bold text-amber-900 font-serif">${key}</h4>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full font-bold">${noteData.type || noteData.pos}</span>
                </div>
                <p class="text-sm text-amber-700 mb-2 font-mono bg-orange-50 px-2 py-1 rounded inline-block">${noteData.zhuyin}</p>
                <p class="text-amber-800 leading-relaxed font-medium">${noteData.def || noteData.meaning}</p>
            `;
            
            const rect = el.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            let left = rect.left + scrollLeft;
            let top = rect.bottom + scrollTop + 8; 
            
            if (left + 300 > document.body.clientWidth) { left = document.body.clientWidth - 310; }
            
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.classList.remove('hidden');
        }
        
        // 優化語音播放：優先採用女聲 (Google 國語/Mei-Jia 等)、語速 0.9、音調 1.05
        async function playAudio(text) {
            if (!('speechSynthesis' in window)) { showError("您的瀏覽器不支援語音朗讀功能。"); return; }
            window.speechSynthesis.cancel();
            
            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) {
                await new Promise(resolve => {
                    const id = setInterval(() => {
                        voices = window.speechSynthesis.getVoices();
                        if (voices.length > 0) { clearInterval(id); resolve(); }
                    }, 100);
                });
            }

            // 嚴格篩選高品質女聲
            const preferredVoices = ['Google 國語', 'Mei-Jia', 'Lili', 'Ting-Ting', 'Hsiao-Chen', 'Yating', 'Xiaoxiao'];
            let targetVoice = null;
            
            for (const pv of preferredVoices) {
                targetVoice = voices.find(v => (v.lang.startsWith('zh') || v.lang.includes('Hant')) && v.name.includes(pv));
                if (targetVoice) break;
            }
            
            // 備用選項：台灣中文
            if (!targetVoice) targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW'); 
            if (!targetVoice) targetVoice = voices.find(v => v.lang.startsWith('zh'));

            // 強化斷句處理：根據全形標點符號建立微停頓陣列，避免一口氣念完
            const chunks = text.split(/([，、。？！；：])/).reduce((acc, curr, i) => {
                if (i % 2 === 0) { 
                    if (curr.trim()) acc.push({ text: curr, pause: 0 });
                } else { 
                    if (acc.length > 0) {
                        acc[acc.length - 1].text += curr;
                        if (['。', '！', '？'].includes(curr)) acc[acc.length - 1].pause = 800; // 句號停頓久
                        else if (['；', '：'].includes(curr)) acc[acc.length - 1].pause = 600; // 分號停頓中
                        else acc[acc.length - 1].pause = 400; // 逗號停頓短
                    }
                }
                return acc;
            }, []);

            if (chunks.length === 0) return;

            const playNext = (index) => {
                if (index >= chunks.length) return;
                const utterance = new SpeechSynthesisUtterance(chunks[index].text);
                utterance.lang = 'zh-TW';
                
                // 設定語速與語調
                utterance.rate = 0.9;  
                utterance.pitch = 1.05; 
                
                if (targetVoice) utterance.voice = targetVoice;
                
                utterance.onend = () => { setTimeout(() => playNext(index + 1), chunks[index].pause); };
                window.speechSynthesis.speak(utterance);
            };

            playNext(0);
        }

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.remove('hidden');
            requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 4000);
        }

    </script>
